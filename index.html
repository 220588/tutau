*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#f4f4f1;font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;color:#12182b}
@media (prefers-color-scheme:dark){html,body{background:#0a0c12;color:#f1f3fa}.card{background:#161b2b!important;border-color:#2a3148!important}.mu{color:#98a1bd!important}}
#f{position:fixed;left:0;right:0;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);width:100%;height:calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));border:0}
#g{position:fixed;inset:0;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));text-align:center}
.av{width:120px;height:120px;border-radius:30px;object-fit:cover;border:2px solid rgba(255,255,255,.6);box-shadow:0 14px 34px rgba(47,125,225,.4);animation:b 3s ease-in-out infinite}
@keyframes b{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
h1{font-size:27px;font-weight:900;margin:14px 0 4px}
p{margin:0}.mu{color:#5f6882;font-size:14px;line-height:1.5}
.card{max-width:440px;margin:16px auto 0;background:#fff;border:1px solid #e3e5ec;border-radius:22px;padding:6px 16px;text-align:left}
.st{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid rgba(128,128,150,.2)}
.st:first-child{border-top:none}
.n{flex:0 0 30px;height:30px;border-radius:50%;background:#2f7de1;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:15px}
.st b{display:block;font-size:15px}.st span{display:block;font-size:13px;color:#5f6882;margin-top:2px;line-height:1.45}
.ic{display:inline-block;width:18px;height:18px;vertical-align:-4px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.warn{max-width:440px;margin:14px auto 0;padding:12px 14px;border-radius:16px;background:#fff3e0;border:1px solid #ffb860;color:#7a3e00;font-size:14px;text-align:left;line-height:1.5}
button{font:inherit;cursor:pointer;display:block;width:100%;max-width:440px;margin:12px auto 0;height:50px;border-radius:16px;font-weight:800;border:none}
.go{background:linear-gradient(180deg,#5b9ff0,#2f7de1);color:#fff;box-shadow:0 10px 24px rgba(47,125,225,.35)}
.ghost{background:transparent;color:#5f6882;height:42px;font-weight:700;font-size:13px}
</style>
